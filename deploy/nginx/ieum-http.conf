# 1단계: 인증서를 받기 전 (DEPLOY-01) → /etc/nginx/sites-available/ieum.conf
# http 로만 듣고, Let's Encrypt 확인 파일(/.well-known/acme-challenge/)만 내준다.
# 인증서를 받은 뒤에는 ieum.conf(https)로 바꾼다.
server {
    listen 80;
    listen [::]:80;
    server_name ieum.me.kr www.ieum.me.kr jenkins.ieum.me.kr;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 "ieum: waiting for https\n";
        default_type text/plain;
    }
}
