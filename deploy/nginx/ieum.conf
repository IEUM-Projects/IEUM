# 이음 Nginx 설정 (DEPLOY-01) → /etc/nginx/sites-available/ieum.conf
# - http → https 로 돌려보냄, www.ieum.me.kr → ieum.me.kr
# - https://ieum.me.kr        → 이음 앱 (127.0.0.1:8080)
# - https://jenkins.ieum.me.kr → Jenkins (127.0.0.1:8090)
# 인증서: Let's Encrypt (sudo certbot certonly --webroot ... 로 받음, 자동 갱신)

# ---------------------------------------------------------------- http (80)
server {
    listen 80;
    listen [::]:80;
    server_name ieum.me.kr www.ieum.me.kr jenkins.ieum.me.kr;

    # 인증서 갱신 확인용
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------- www → 대표 주소
server {
    # Ubuntu 24.04 의 Nginx(1.24)는 'http2 on;' 대신 listen 에 http2 를 쓴다
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.ieum.me.kr;
    ssl_certificate     /etc/letsencrypt/live/ieum.me.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ieum.me.kr/privkey.pem;
    include /etc/nginx/snippets/ieum-ssl.conf;
    return 301 https://ieum.me.kr$request_uri;
}

# ---------------------------------------------------------------- 이음
server {
    # Ubuntu 24.04 의 Nginx(1.24)는 'http2 on;' 대신 listen 에 http2 를 쓴다
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ieum.me.kr;
    ssl_certificate     /etc/letsencrypt/live/ieum.me.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ieum.me.kr/privkey.pem;
    include /etc/nginx/snippets/ieum-ssl.conf;

    # 동네 이야기 사진 한 장 10MB + 여유
    client_max_body_size 12m;

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml application/manifest+json text/plain application/xml;
    gzip_min_length 1024;

    # 관리자: 인허가 CSV 올리기 (일반음식점 파일이 150MB 넘음)
    location = /api/admin/closures/import {
        client_max_body_size 1g;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        include /etc/nginx/snippets/ieum-proxy.conf;
    }

    location / {
        proxy_read_timeout 60s;
        include /etc/nginx/snippets/ieum-proxy.conf;
    }
}

# ---------------------------------------------------------------- Jenkins
server {
    # Ubuntu 24.04 의 Nginx(1.24)는 'http2 on;' 대신 listen 에 http2 를 쓴다
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name jenkins.ieum.me.kr;
    ssl_certificate     /etc/letsencrypt/live/ieum.me.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ieum.me.kr/privkey.pem;
    include /etc/nginx/snippets/ieum-ssl.conf;

    # (선택) 내 IP 에서만 Jenkins 화면을 열게 하려면 아래 두 줄의 주석을 풀고 IP 를 넣는다.
    # 단, GitHub Webhook(/github-webhook/)은 GitHub 서버에서 오므로 막으면 안 된다.
    # location / { allow 내.IP.주소.여기; deny all; proxy_pass http://127.0.0.1:8090; ... }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port 443;
        proxy_read_timeout 90s;
        proxy_redirect http://127.0.0.1:8090 https://jenkins.ieum.me.kr;
    }
}
