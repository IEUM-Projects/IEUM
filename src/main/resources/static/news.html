<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>시장·로컬 소식 - 이음</title>
  <meta name="description" content="전통시장, 백년가게, 로컬크리에이터 관련 최신 기사를 모아 봐요.">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/course.css">
  <link rel="stylesheet" href="/css/news.css">
</head>
<body class="course-page">
  <a class="skip-link" href="#main">본문 바로가기</a>
  <header class="site-header">
    <a href="/" class="back-link">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg><span>홈</span>
    </a>
    <a class="logo center-logo" href="/">이음</a>
    <div id="account" class="account"></div>
  </header>
  <main id="main" class="course-main" tabindex="-1">
    <p class="eyebrow">동네 소식</p>
    <h1>시장·로컬 소식</h1>
    <section class="add-box" aria-labelledby="newsListTitle">
      <h2 id="newsListTitle" class="sr-only">기사 목록</h2>
      <div class="tabs" role="tablist" aria-label="소식 주제" id="newsTabs"></div>
      <div id="newsPanel" role="tabpanel" tabindex="-1">
        <p id="newsStatus" class="news-note" role="status"></p>
        <ul id="newsList" class="news-list"></ul>
      </div>
    </section>
    <p class="note" id="newsNote"></p>
  </main>
  <script type="module" src="/js/news.js"></script>
</body>
</html>
