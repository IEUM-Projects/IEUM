    <p class="page-lead">관리자가 바꾼 일을 최근 순으로 남겨요. 누가 언제 글을 가리고, 회원을 정지·탈퇴시켰는지 볼 수 있어요. 1년이 지난 기록은 지워요.</p>

        <ul id="list" class="admin-list action-list"></ul>
