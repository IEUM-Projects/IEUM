<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
  <title>비밀번호 찾기 - 이음</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body class="auth-page">
  <a class="skip-link" href="#main">본문 바로가기</a>
  <header class="site-header">
    <a class="back-link" href="/login.html" id="backLink">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>로그인
    </a>
    <a class="logo" href="/">이음</a>
    <span class="header-spacer"></span>
  </header>
  <main id="main" class="auth-main" tabindex="-1">
    <section class="auth-card">
      <h1>비밀번호 찾기</h1>
      <p class="lead" id="lead">가입한 이메일로 인증번호를 보내 드려요.</p>

      <p id="formAlert" class="form-alert" role="alert" hidden></p>

      <!-- 1단계: 이메일 → 6자리 번호 -->
      <form id="findForm" novalidate>
        <div class="field">
          <label for="email">가입한 이메일</label>
          <div class="inline-form">
            <input id="email" name="email" type="email" autocomplete="email" maxlength="100" required aria-describedby="emailOk emailError">
            <button type="button" id="sendCode" class="button-secondary">인증번호 받기</button>
          </div>
          <p id="emailOk" class="ok" role="status"></p>
          <p id="emailError" class="error"></p>
          <div id="codeBox" class="code-box" hidden>
            <label for="emailCode">인증번호 6자리</label>
            <div class="inline-form">
              <input id="emailCode" name="emailCode" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]*" aria-describedby="codeHelp codeError">
              <button type="button" id="confirmCode" class="button-secondary">확인</button>
            </div>
            <p id="codeHelp" class="help"><span id="codeTimer"></span> 메일이 안 오면 스팸함을 보거나 <button type="button" id="resendCode" class="link-button">다시 받기</button></p>
            <p id="codeError" class="error" role="alert"></p>
          </div>
        </div>
        <p class="help kakao-note">카카오로 가입했다면 비밀번호가 없어요. <a href="/login.html">로그인 화면</a>에서 ‘카카오로 시작하기’를 눌러 주세요.</p>
      </form>

      <!-- 2단계: 새 비밀번호 (번호를 맞힌 뒤 10분 안에) -->
      <form id="resetForm" novalidate hidden>
        <p class="form-alert success" id="verifiedNote" role="status"></p>
        <div class="field">
          <label for="password">새 비밀번호</label>
          <input id="password" name="password" type="password" autocomplete="new-password" maxlength="64" required aria-describedby="passwordRules passwordHelp passwordError">
          <ul id="passwordRules" class="rules" aria-live="polite"></ul>
          <p id="passwordHelp" class="help">공백·한글, 같은 글자 3번(aaa), 이어지는 글자(abc·123), 쉬운 단어(password), 이메일 아이디·닉네임, 지금 쓰는 비밀번호는 쓸 수 없어요.</p>
          <p id="passwordError" class="error"></p>
        </div>
        <div class="field">
          <label for="passwordConfirm">새 비밀번호 확인</label>
          <input id="passwordConfirm" name="passwordConfirm" type="password" autocomplete="new-password" maxlength="64" required aria-describedby="confirmError">
          <p id="confirmError" class="error"></p>
        </div>
        <button type="submit" id="submitButton" class="button-primary wide">비밀번호 바꾸기</button>
        <p class="help">바꾸면 모든 기기에서 로그아웃돼요.</p>
      </form>

      <p class="switch-link">비밀번호가 생각났나요? <a href="/login.html" id="loginLink">로그인</a></p>
    </section>
  </main>
  <footer class="mini-footer"><a href="/terms.html">이용약관</a><a class="privacy-link" href="/privacy.html">개인정보 처리방침</a><a href="/notices.html">공지사항</a></footer>
  <script type="module" src="/js/forgot-password.js"></script>
</body>
</html>
