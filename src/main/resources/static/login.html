<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
  <title>로그인 - 이음</title>
  <meta name="description" content="내 주변 백년가게와 오늘 장 서는 전통시장, 이번 주 근처 축제를 한곳에서 찾아보세요.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#11473d">
  <link rel="manifest" href="/manifest.webmanifest">
  <!-- 링크 미리보기 (SEO-01): __SITE_URL__ 은 서버가 사이트 주소로 바꿔서 보낸다 -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="이음">
  <meta property="og:locale" content="ko_KR">
  <meta property="og:title" content="로그인 - 이음">
  <meta property="og:description" content="내 주변 백년가게와 오늘 장 서는 전통시장, 이번 주 근처 축제를 한곳에서 찾아보세요.">
  <meta property="og:image" content="__SITE_URL__/images/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="이음 - 우리 동네 백년가게·시장·축제">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/auth.css">
  <link rel="stylesheet" href="/css/policy.css">
</head>
<body class="auth-page">
  <a class="skip-link" href="#main">본문 바로가기</a>
  <header class="site-header">
    <a class="back-link" href="/map.html">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>지도
    </a>
    <a class="logo" href="/">이음</a>
    <span class="header-spacer"></span>
  </header>
  <main id="main" class="auth-main" tabindex="-1">
    <section class="auth-card">
      <h1>로그인</h1>
      <p class="lead">우리 동네 백년가게 이야기를 나눠 보세요.</p>

      <p id="formNotice" class="form-alert success" role="status" hidden></p>
      <p id="formAlert" class="form-alert" role="alert" hidden></p>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email">이메일</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="password">비밀번호</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <p class="find-password"><a id="findLink" href="/forgot-password.html">비밀번호를 잊으셨나요?</a></p>
        <button type="submit" id="submitButton" class="button-primary wide">로그인</button>
      </form>

      <div class="divider">또는</div>
      <button type="button" id="kakaoButton" class="kakao-button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#000" d="M12 4C7 4 3 7.1 3 11c0 2.5 1.7 4.7 4.2 5.9l-.9 3.4c-.1.3.3.6.6.4l4-2.6c.4 0 .7.1 1.1.1 5 0 9-3.1 9-7S17 4 12 4z"/></svg>카카오로 시작하기
      </button>

      <p class="switch-link">아직 회원이 아니신가요? <a id="signupLink" href="/signup.html">회원가입</a></p>
    </section>
  </main>
  <footer class="mini-footer"><a href="/terms.html">이용약관</a><a class="privacy-link" href="/privacy.html">개인정보 처리방침</a><a href="/notices.html">공지사항</a></footer>
  <script type="module" src="/js/login.js"></script>
</body>
</html>
