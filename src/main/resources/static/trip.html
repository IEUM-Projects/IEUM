<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>걷기 코스 출발점 고르기 - 이음</title>
  <meta name="description" content="출발점을 정하면 근처 백년가게와 관광지를 이어 걷기 코스를 만들어 드려요.">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/course.css">
  <link rel="stylesheet" href="/css/trip.css">
</head>
<body class="course-page">
  <a class="skip-link" href="#main">본문 바로가기</a>
  <header class="site-header">
    <a href="/" class="back-link">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg><span>홈</span>
    </a>
    <a class="logo center-logo" href="/">이음</a>
    <div id="account" class="account"></div>
  </header>
  <main id="main" class="course-main" tabindex="-1">
    <p class="eyebrow">걷기 코스 만들기</p>
    <h1>어디서 출발할까요?</h1>
    <p class="trip-lead">출발점을 정하면 근처 백년가게와 관광지를 가까운 순으로 이어 걷기 코스를 만들어 드려요.</p>

    <section class="trip-box" aria-labelledby="findTitle">
      <h2 id="findTitle">장소를 찾아서</h2>
      <form id="tripSearch" class="trip-search" role="search">
        <label for="tripQ">장소 이름이나 주소</label>
        <div class="trip-search-row">
          <input id="tripQ" name="q" type="search" maxlength="30" autocomplete="off" enterkeyhint="search" placeholder="예: 경주역, 전주 한옥마을" aria-describedby="tripHint">
          <button type="submit" class="button-secondary">찾기</button>
        </div>
        <p id="tripHint" class="trip-hint">2~30자로 넣어 주세요.</p>
      </form>
      <p id="tripStatus" class="trip-status" role="status"></p>
      <ul id="tripResults" class="trip-results"></ul>
    </section>

    <p class="note">장소 검색: 카카오 · 관광 정보: 한국관광공사 국문 관광정보 · 걷는 시간은 직선 거리로 어림한 값이에요.</p>
  </main>
  <script type="module" src="/js/trip.js"></script>
</body>
</html>
