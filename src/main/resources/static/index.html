<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>이음 - 우리 동네 백년가게</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/map.css">
</head>
<body>
  <a class="skip-link" href="#main">본문 바로가기</a>
  <!-- 상단: 로고, 지역 선택, 카테고리 -->
  <header class="topbar">
    <div class="topbar-row">
      <a class="logo" href="/">이음</a>
      <button type="button" id="regionButton" class="region-button">지역 선택</button>
      <select id="radiusSelect" class="radius-select" aria-label="검색 반경">
        <option value="500">500m</option>
        <option value="1000" selected>1km</option>
        <option value="3000">3km</option>
      </select>
      <!-- 로그인 전: 로그인 링크 / 로그인 후: 닉네임 버튼 + 메뉴 (map.js가 채움) -->
      <div id="account" class="account"></div>
    </div>
    <nav class="chips" id="categoryChips" aria-label="카테고리"></nav>
  </header>

  <!-- 지도와 목록 -->
  <main id="main" class="map-area" tabindex="-1">
    <div id="map" class="map" aria-label="가게 지도"></div>
    <section id="listView" class="list-view" hidden aria-label="가게 목록">
      <p id="listSummary" class="list-summary"></p>
      <ul id="storeList" class="store-list"></ul>
    </section>

    <button type="button" id="researchButton" class="research-button" hidden>이 지역에서 다시 검색</button>
    <div class="floating">
      <button type="button" id="locateButton" class="fab" aria-label="내 위치로 이동">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
      </button>
      <a href="/festivals.html" class="fab fab-wide">축제 달력</a>
      <button type="button" id="viewToggle" class="fab fab-wide">목록 보기</button>
    </div>
    <p id="toast" class="toast" role="status" hidden></p>
  </main>

  <!-- 핀을 눌렀을 때 아래에서 올라오는 가게 요약 카드 -->
  <article id="storeCard" class="store-card" hidden aria-live="polite"></article>

  <!-- 지역 선택 창 -->
  <dialog id="regionDialog" class="region-dialog">
    <form method="dialog" class="region-form">
      <h2>어느 지역을 볼까요?</h2>
      <p class="hint">위치 권한이 없으면 지역을 골라서 볼 수 있어요.</p>
      <label>시·도
        <select id="sidoSelect"></select>
      </label>
      <label>시·군·구
        <select id="sigunguSelect"></select>
      </label>
      <div class="dialog-actions">
        <button value="cancel" class="button-secondary">닫기</button>
        <button value="ok" id="regionConfirm" class="button-primary">이 지역 보기</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="/js/map.js"></script>
</body>
</html>
