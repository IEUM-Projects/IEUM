spring:
  profiles:
    active: local
  datasource:
    url: jdbc:mysql://localhost:3306/ieum?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate   # 테이블을 절대 지우거나 바꾸지 않음
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true