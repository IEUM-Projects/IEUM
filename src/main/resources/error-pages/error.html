<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#11473d">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
  <title>{{TITLE}} - 이음</title>
  <!-- 오류 화면 (ERR-01): 서버(ErrorPageController)가 상태 코드에 맞는 제목·문구·버튼을 채워 보낸다. 글꼴 서버가 막혀도 보이도록 외부 글꼴은 쓰지 않는다 -->
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/error.css">
</head>
<body class="error-page">
  <a class="skip-link" href="#main">본문 바로가기</a>
  <header class="site-header">
    <a href="/" class="back-link">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>홈
    </a>
    <a class="logo center-logo" href="/">이음</a>
    <span class="header-spacer"></span>
  </header>
  <main id="main" class="error-main" tabindex="-1">
    <p class="error-code">{{CODE_LABEL}}</p>
    <h1>{{TITLE}}</h1>
    <p class="error-lead">{{MESSAGE}}</p>
    <div class="error-actions">
      {{ACTIONS}}
    </div>
    {{SEARCH}}
  </main>
  <footer class="mini-footer"><a href="/terms.html">이용약관</a><a class="privacy-link" href="/privacy.html">개인정보 처리방침</a><a href="/notices.html">공지사항</a></footer>
</body>
</html>
